<!DOCTYPE html>
<html lang="en">
    <head>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GN Math — Yumix Games</title>
    <meta name="title" content="GN Math">
    <meta name="description" content="Play unblocked games on GN Math. Fast, free, no downloads.">
    <script src="https://cdn.jsdelivr.net/gh/lostgemsy/gn-math.github.io@main/gnmath.js"></script>
    <style>
:root {
    --bg: #050505;
    --bg-2: #0a0a0a;
    --text: #f5f5f5;
    --text-dim: rgba(255,255,255,.4);
    --text-dim-2: rgba(255,255,255,.6);
    --card: rgba(255,255,255,.035);
    --card-border: rgba(255,255,255,.08);
    --card-border-hover: rgba(255,255,255,.35);
    --input-bg: rgba(255,255,255,.04);
    --input-border: rgba(255,255,255,.1);
    --input-border-focus: rgba(255,255,255,.4);
    --shadow: rgba(0,0,0,.6);
    --logo-dim: #666;
}
html[data-theme="light"] {
    --bg: #f5f5f5;
    --bg-2: #ffffff;
    --text: #111;
    --text-dim: rgba(0,0,0,.45);
    --text-dim-2: rgba(0,0,0,.65);
    --card: rgba(0,0,0,.03);
    --card-border: rgba(0,0,0,.08);
    --card-border-hover: rgba(0,0,0,.3);
    --input-bg: rgba(0,0,0,.03);
    --input-border: rgba(0,0,0,.1);
    --input-border-focus: rgba(0,0,0,.4);
    --shadow: rgba(0,0,0,.15);
    --logo-dim: #999;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { transition: background .3s ease, color .3s ease; }
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 20px 80px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}
header, .count, #container, #featuredZones, .theme-toggle, .home-btn {
    position: relative;
    z-index: 1;
}

/* Bouncy animations (kept light — transform only) */
@keyframes bouncyIn {
    0% { opacity: 0; transform: translateY(20px) scale(0.95); }
    60% { opacity: 1; transform: translateY(-4px) scale(1.02); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes popIn {
    0% { transform: scale(0.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
@keyframes slideInDown {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(0); }
}

/* HEADER */
header {
    max-width: 1200px;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-right: 60px;
    animation: slideInDown .5s cubic-bezier(.2,.9,.25,1.15) both;
}
.header-left {
    display: flex;
    align-items: center;
    gap: 16px;
}
.main-logo {
    width: clamp(56px, 8vw, 84px);
    height: auto;
    filter: drop-shadow(0 8px 20px var(--shadow));
    transition: transform .25s ease;
}
.main-logo:hover { transform: scale(1.08) rotate(-4deg); }
h1 {
    font-size: clamp(1.75rem, 5vw, 2.75rem);
    font-weight: 900;
    letter-spacing: -0.05em;
    color: var(--text);
}
h1 span { color: var(--logo-dim); }
.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}
.search {
    width: min(320px, 100%);
    height: 48px;
    padding: 0 18px;
    border-radius: 12px;
    border: 1.5px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color .2s ease;
}
.search:focus { border-color: var(--input-border-focus); }
.search::placeholder { color: var(--text-dim); }
#sortOptions {
    height: 48px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1.5px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
}
#sortOptions:hover { border-color: var(--input-border-focus); }

/* Buttons */
.theme-toggle, .home-btn, #settings {
    height: 48px;
    border-radius: 12px;
    border: 1.5px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform .2s ease, background .2s ease, border-color .2s ease;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    padding: 0 16px;
}
.home-btn { padding: 0 20px; }
.theme-toggle, #settings { width: 48px; padding: 0; }
.theme-toggle:hover, .home-btn:hover, #settings:hover {
    transform: translateY(-3px) scale(1.04);
    border-color: var(--input-border-focus);
    background: var(--card);
    box-shadow: 0 10px 25px var(--shadow);
}
.theme-toggle:active, .home-btn:active, #settings:active {
    transform: translateY(-1px) scale(.98);
}
.theme-toggle svg, .home-btn svg {
    width: 18px; height: 18px;
    stroke: currentColor; fill: none;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    transition: transform .3s ease;
}
.home-btn:hover svg { transform: translateX(-3px); }
.theme-toggle .icon-sun { display: none; }
.theme-toggle .icon-moon { display: block; }
html[data-theme="light"] .theme-toggle .icon-sun { display: block; }
html[data-theme="light"] .theme-toggle .icon-moon { display: none; }

/* MAIN */
main {
    max-width: 1200px;
    margin: 0 auto;
    padding-bottom: 4rem;
}

details {
    margin-bottom: 1.5rem;
}
details summary {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    cursor: pointer;
    padding: 8px 0;
    list-style: none;
    color: var(--text);
    transition: color .2s ease;
}
details summary::-webkit-details-marker { display: none; }
details summary::before {
    content: "▸";
    display: inline-block;
    margin-right: 10px;
    transition: transform .25s ease;
    color: var(--text-dim);
}
details[open] summary::before { transform: rotate(90deg); }
details summary:hover { color: var(--text-dim-2); }

#container,
#featuredZones {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
    margin-top: 1rem;
}

/* Game card — light on effects for perf */
.zone-item {
    display: flex;
    flex-direction: column;
    padding: 10px;
    border-radius: 16px;
    background: var(--card);
    border: 1.5px solid var(--card-border);
    cursor: pointer;
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    will-change: transform;
    contain: layout style paint;
}
.zone-item:hover {
    border-color: var(--card-border-hover);
    transform: translateY(-5px);
    box-shadow: 0 12px 30px var(--shadow);
}
.zone-item img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 11px;
    background: var(--bg-2);
    display: block;
}
.zone-item button {
    background: transparent;
    color: var(--text);
    border: 0;
    padding: 12px 4px 4px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
    transition: color .2s ease;
}
.zone-item:hover button { color: var(--text-dim-2); }

.empty-msg {
    grid-column: 1 / -1;
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
    font-weight: 600;
}

/* ZONE VIEWER */
#zoneViewer {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 9999;
    display: none;
    flex-direction: column;
}
#zoneViewer.active { display: flex; }

.zone-header {
    background: var(--bg-2);
    border-bottom: 1.5px solid var(--input-border);
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
}
.zone-title { flex: 1; min-width: 0; }
#zoneName {
    font-size: 1.1rem;
    font-weight: 800;
    margin: 0 0 2px;
    letter-spacing: -0.02em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
#zoneId { display: none; }
#zoneAuthor {
    font-size: 12.5px;
    color: var(--text-dim);
    text-decoration: none;
    font-weight: 600;
}
#zoneAuthor:hover { color: var(--text); text-decoration: underline; }

.zone-controls { display: flex; gap: 8px; flex-wrap: wrap; }
.zone-controls button {
    height: 38px;
    padding: 0 14px;
    border-radius: 10px;
    border: 1.5px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
}
.zone-controls button:hover {
    transform: translateY(-2px);
    border-color: var(--input-border-focus);
    background: var(--card);
}
.zone-controls button:active { transform: scale(.97); }

#zoneFrame {
    flex: 1;
    border: 0;
    width: 100%;
    background: #000;
}

/* POPUP */
#popupOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 12000;
    padding: 20px;
}
#popupOverlay.active { display: flex; }
.popup {
    background: var(--bg-2);
    border-radius: 18px;
    box-shadow: 0 20px 50px var(--shadow);
    width: 100%;
    max-width: 500px;
    max-height: 80vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1.5px solid var(--input-border);
    animation: popIn .3s cubic-bezier(.2,.9,.25,1.15);
}
.popup-header {
    background: var(--bg);
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid var(--input-border);
}
#popupTitle {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.02em;
}
#popupClose {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: 1.5px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .2s ease, background .2s ease;
}
#popupClose:hover { transform: rotate(90deg) scale(1.1); background: var(--card); }
#popupBody {
    padding: 22px;
    overflow-y: auto;
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
}
#popupBody input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 16px;
    border-radius: 10px;
    border: 1.5px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
}
#popupBody input[type="text"]:focus { border-color: var(--input-border-focus); }
#settings-button {
    width: 100%;
    padding: 14px;
    background: var(--input-bg);
    color: var(--text);
    border: 1.5px solid var(--input-border);
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
    transition: transform .2s ease, background .2s ease, border-color .2s ease;
}
#settings-button:hover {
    transform: translateY(-2px);
    background: var(--card);
    border-color: var(--input-border-focus);
}

/* PAGE SLIDE */
.page-slide {
    position: fixed;
    inset: 0;
    z-index: 30000;
    background: var(--bg);
    transform: translateX(100%);
    transition: transform .55s cubic-bezier(.65, 0, .35, 1);
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
}
.page-slide::after {
    content: "";
    width: 44px;
    height: 44px;
    border: 3px solid var(--input-border);
    border-top-color: var(--text);
    border-radius: 50%;
    opacity: 0;
}
.page-slide.active {
    transform: translateX(0);
    pointer-events: auto;
}
.page-slide.active::after {
    opacity: 1;
    animation: spin .9s linear infinite;
    animation-delay: .3s;
}
.page-slide.enter { transform: translateX(0); transition: none; }
.page-slide.enter.leaving {
    transform: translateX(-100%);
    transition: transform .55s cubic-bezier(.65, 0, .35, 1);
}
@keyframes spin { to { transform: rotate(360deg); } }

/* MOBILE */
@media (max-width: 700px) {
    body { padding: 16px 14px 60px; }
    header { padding-right: 0; gap: 12px; }
    .header-left { gap: 12px; }
    .main-logo { width: 50px; }
    h1 { font-size: 1.5rem; }
    .header-right { width: 100%; }
    .search { width: 100%; flex: 1; }
    .home-btn { padding: 0 14px; }
    .home-btn span { display: none; }
    #container, #featuredZones {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }
    .zone-item { padding: 7px; border-radius: 12px; }
    .zone-item button { font-size: 12px; padding: 10px 2px 2px; }
    .zone-controls button { height: 34px; padding: 0 10px; font-size: 11.5px; }
}

/* Chromebook / low-power: cut heavy stuff */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <img src="logo.png" alt="Yumix" class="main-logo">
        <h1>GN <span>Math</span></h1>
    </div>
    <div class="header-right">
        <input type="text" id="searchBar" class="search" placeholder="Search games..." autocomplete="off">
        <select id="sortOptions">
            <option value="name">Name</option>
            <option value="id">ID (Date)</option>
            <option value="popular">Popular</option>
        </select>
        <button class="home-btn" id="homeBtn" title="Back to Yumix Games">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            <span>Yumix</span>
        </button>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">
            <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button id="settings" title="Settings">⚙</button>
    </div>
</header>

<main>
    <details id="featuredZonesWrapper" open>
        <summary id="allZonesSummary">Featured Games</summary>
        <div id="featuredZones"></div>
    </details>
    <details id="allZonesWrapper" open>
        <summary id="allSummary">All Games</summary>
        <div id="container">Loading...</div>
    </details>
</main>

<div id="zoneViewer">
    <div class="zone-header">
        <div class="zone-title">
            <h2 id="zoneName">game</h2>
            <span id="zoneId" style="display: none;"></span>
            <a id="zoneAuthor" href="#" target="_blank">by Author</a>
        </div>
        <div class="zone-controls">
            <button onclick="fullscreenZone()">Fullscreen</button>
            <button onclick="aboutBlank()">New Tab</button>
            <button onclick="closeZone()">Close</button>
        </div>
    </div>
    <iframe id="zoneFrame" allowfullscreen
        allow="autoplay; fullscreen; gamepad; clipboard-write; accelerometer; gyroscope"
        referrerpolicy="no-referrer"></iframe>
</div>

<div id="popupOverlay">
    <div class="popup">
        <div class="popup-header">
            <h3 id="popupTitle">Title</h3>
            <button id="popupClose" onclick="closePopup()">×</button>
        </div>
        <div id="popupBody"></div>
    </div>
</div>

<div class="page-slide" id="pageSlide"></div>

<script>
/* THEME */
(function () {
    const saved = localStorage.getItem("theme");
    const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
    const theme = saved || (prefersLight ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", theme);
})();
document.getElementById("themeToggle").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
});

/* PAGE SLIDE — entering */
(function () {
    const slide = document.getElementById("pageSlide");
    if (sessionStorage.getItem("slideFrom")) {
        sessionStorage.removeItem("slideFrom");
        slide.classList.add("enter");
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                slide.classList.add("leaving");
            });
        });
        setTimeout(() => {
            slide.classList.remove("enter", "leaving");
        }, 700);
    }
})();

/* HOME BUTTON — slide out */
document.getElementById("homeBtn").addEventListener("click", () => {
    document.getElementById("pageSlide").classList.add("active");
    sessionStorage.setItem("slideFrom", "true");
    setTimeout(() => {
        window.location.href = "index.html";
    }, 620);
});

/* =========================================================
   GN MATH LOADER + OPTIMIZATIONS
   ========================================================= */
const container = document.getElementById('container');
const featuredContainer = document.getElementById('featuredZones');
const zoneViewer = document.getElementById('zoneViewer');
let zoneFrame = document.getElementById('zoneFrame');
const searchBar = document.getElementById('searchBar');
const sortOptions = document.getElementById('sortOptions');

const zonesurls = [
    "https://cdn.jsdelivr.net/gh/lostgemsy/assets@main/zones.json",
    "https://cdn.jsdelivr.net/gh/lostgemsy/assets@latest/zones.json",
    "https://cdn.jsdelivr.net/gh/lostgemsy/assets@master/zones.json",
    "https://cdn.jsdelivr.net/gh/lostgemsy/assets/zones.json"
];
let zonesURL = zonesurls[0];
const coverURL = "https://cdn.jsdelivr.net/gh/lostgemsy/covers@main";
const htmlURL = "https://cdn.jsdelivr.net/gh/lostgemsy/html@main";
let zones = [];
let popularityData = {};

async function listZones() {
    try {
        const response = await fetch(zonesURL + "?t=" + Date.now());
        const json = await response.json();
        zones = json;
        if (zones[0]) zones[0].featured = true;
        sortZones();
        // Featured only first
        displayFeaturedZones(zones.filter(z => z.featured));
        // Defer big list a beat so the first paint isn't blocked
        setTimeout(() => displayZones(zones), 50);
        // Popularity fetch after — doesn't block
        fetchPopularity().then(() => {
            if (sortOptions.value === "popular") sortZones();
        });
        const search = new URLSearchParams(window.location.search);
        const id = search.get('id');
        if (id) {
            const zone = zones.find(z => z.id + '' == id + '');
            if (zone) openZone(zone);
        }
    } catch (error) {
        console.error(error);
        container.innerHTML = '<div class="empty-msg">Error loading games.</div>';
    }
}

async function fetchPopularity() {
    try {
        const response = await fetch("https://data.jsdelivr.com/v1/stats/packages/gh/lostgemsy/html@main/files?period=year");
        const data = await response.json();
        data.forEach(file => {
            const m = file.name.match(/\/(\d+)\.html$/);
            if (m) popularityData[parseInt(m[1])] = file.hits.total;
        });
    } catch (e) {}
}

function sortZones() {
    const sortBy = sortOptions.value;
    if (sortBy === 'name') zones.sort((a, b) => a.name.localeCompare(b.name));
    else if (sortBy === 'id') zones.sort((a, b) => a.id - b.id);
    else if (sortBy === 'popular') zones.sort((a, b) => (popularityData[b.id] || 0) - (popularityData[a.id] || 0));
}

function makeCard(file) {
    const card = document.createElement("div");
    card.className = "zone-item";
    card.addEventListener("click", () => openZone(file));
    const img = document.createElement("img");
    img.dataset.src = file.cover.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
    img.alt = file.name;
    img.loading = "lazy";
    img.decoding = "async";
    img.className = "lazy-zone-img";
    card.appendChild(img);
    const btn = document.createElement("button");
    btn.textContent = file.name;
    btn.addEventListener("click", (e) => { e.stopPropagation(); openZone(file); });
    card.appendChild(btn);
    return card;
}

function displayFeaturedZones(list) {
    featuredContainer.innerHTML = "";
    list.forEach(f => featuredContainer.appendChild(makeCard(f)));
    if (!list.length) featuredContainer.innerHTML = '<div class="empty-msg">No featured games.</div>';
    else document.getElementById("allZonesSummary").textContent = `Featured Games (${list.length})`;
    observeLazy('#featuredZones img.lazy-zone-img');
}

function displayZones(list) {
    // Use a DocumentFragment — batches DOM inserts, way faster on Chromebooks
    const frag = document.createDocumentFragment();
    list.forEach(f => frag.appendChild(makeCard(f)));
    container.innerHTML = "";
    container.appendChild(frag);
    if (!list.length) container.innerHTML = '<div class="empty-msg">No games found.</div>';
    else document.getElementById("allSummary").textContent = `All Games (${list.length})`;
    observeLazy('#container img.lazy-zone-img');
}

let lazyObserver = null;
function observeLazy(selector) {
    if (!lazyObserver) {
        lazyObserver = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    if (img.dataset.src) img.src = img.dataset.src;
                    obs.unobserve(img);
                }
            });
        }, { rootMargin: "200px", threshold: 0.01 });
    }
    document.querySelectorAll(selector).forEach(img => lazyObserver.observe(img));
}

// Debounced search — prevents lag while typing
let searchTimer = null;
searchBar.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
        const q = searchBar.value.toLowerCase();
        const filtered = q ? zones.filter(z => z.name.toLowerCase().includes(q)) : zones;
        if (q) document.getElementById("featuredZonesWrapper").removeAttribute("open");
        displayZones(filtered);
    }, 120);
});

sortOptions.addEventListener("change", () => {
    sortZones();
    displayZones(zones);
});

function openZone(file) {
    if (file.url.startsWith("http")) {
        window.open(file.url, "_blank");
        return;
    }
    const url = file.url.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
    fetch(url + "?t=" + Date.now()).then(r => r.text()).then(html => {
        zoneFrame.contentDocument.open();
        zoneFrame.contentDocument.write(html);
        zoneFrame.contentDocument.close();
        document.getElementById('zoneName').textContent = file.name;
        document.getElementById('zoneId').textContent = file.id;
        document.getElementById('zoneAuthor').textContent = "by " + file.author;
        if (file.authorLink) document.getElementById('zoneAuthor').href = file.authorLink;
        zoneViewer.classList.add("active");
        const u = new URL(window.location);
        u.searchParams.set('id', file.id);
        history.pushState(null, '', u.toString());
    }).catch(err => alert("Failed to load game: " + err));
}

function aboutBlank() {
    const w = window.open("about:blank", "_blank");
    const zone = zones.find(z => z.id + '' === document.getElementById('zoneId').textContent);
    if (!zone || !w) return;
    const url = zone.url.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
    fetch(url + "?t=" + Date.now()).then(r => r.text()).then(html => {
        w.document.open();
        w.document.write(html);
        w.document.close();
    });
}

function closeZone() {
    zoneViewer.classList.remove("active");
    zoneFrame.src = "about:blank";
    const u = new URL(window.location);
    u.searchParams.delete('id');
    history.pushState(null, '', u.toString());
}

function fullscreenZone() {
    if (zoneFrame.requestFullscreen) zoneFrame.requestFullscreen();
}

function closePopup() {
    document.getElementById('popupOverlay').classList.remove("active");
}

document.getElementById('settings').addEventListener('click', () => {
    document.getElementById('popupTitle').textContent = "Settings";
    document.getElementById('popupBody').innerHTML = `
        <button id="settings-button" onclick="toggleDark()">Toggle Theme</button>
    `;
    document.getElementById('popupOverlay').classList.add("active");
});

function toggleDark() {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
}

listZones();
</script>
