<!DOCTYPE html>
<html lang="en">
    <head>
    <link rel="icon" type="image/gif" href="/logo.gif">
    <link rel="apple-touch-icon" href="/logo.gif">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GN Math — Yumix Games</title>
    <meta name="title" content="GN Math">
    <meta name="description" content="Play unblocked games on GN Math. Fast, free, no downloads.">
    <script src="https://cdn.jsdelivr.net/gh/lostgemsy/gn-math.github.io@main/gnmath.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
:root {
    /* Green forest theme */
    --bg: #0a0f0a;
    --bg-2: #0f150f;
    --bg-3: #141c14;
    --text: #e8f0e8;
    --text-dim: rgba(180, 220, 180, 0.55);
    --text-dim-2: rgba(200, 235, 200, 0.82);
    --card: rgba(30, 50, 30, 0.32);
    --card-hover: rgba(50, 80, 50, 0.45);
    --card-border: rgba(120, 200, 120, 0.18);
    --card-border-hover: rgba(140, 240, 140, 0.45);
    --input-bg: rgba(10, 20, 10, 0.45);
    --input-border: rgba(120, 200, 120, 0.22);
    --input-border-focus: rgba(140, 240, 140, 0.65);
    --shadow: rgba(0, 0, 0, 0.85);
    --shadow-glow: rgba(92, 184, 92, 0.1);
    --accent: #5cb85c;
    --accent-2: #3a9e3a;
    --accent-glow: rgba(92, 184, 92, 0.35);
    --ring: rgba(92, 184, 92, 0.25);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    position: relative;
    isolation: isolate;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 24px 20px 80px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    margin-right: 180px;
    transition: margin-right 0.3s cubic-bezier(0.22, 0.98, 0.36, 1);

    background-color: #0a0f0a;
    background-image: none;
}

body::before {
    content: '';
    position: fixed;
    inset: -18px;
    background: url('/public/assets/backgrounds/background.png') center / cover no-repeat;
    filter: blur(7px);
    transform: scale(1.04);
    opacity: 0.9;
    z-index: -2;
    pointer-events: none;
}

body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.28));
    z-index: -1;
    pointer-events: none;
}

header, .count, #container, #featuredZones, .theme-toggle, .home-btn {
    position: relative;
    z-index: 1;
}

/* Animations */
@keyframes popIn {
    0% { transform: scale(0.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
@keyframes slideInDown {
    0% { transform: translateY(-100%); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}
@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}
@keyframes fadeUp {
    0% { opacity: 0; transform: translateY(14px); }
    100% { opacity: 1; transform: translateY(0); }
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
@keyframes slideRight {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
}
@keyframes bounceIn {
    0%   { opacity: 0; transform: translateY(20px) scale(0.94); }
    60%  { opacity: 1; transform: translateY(-6px) scale(1.02); }
    80%  { transform: translateY(2px) scale(0.99); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes gentleFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
}

/* HEADER */
header {
    max-width: 1240px;
    margin: 0 auto 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 18px 22px 18px 24px;
    border-radius: 20px;
    background: rgba(15, 30, 15, 0.55);
    border: 1px solid rgba(120, 200, 120, 0.15);
    animation: slideInDown .45s cubic-bezier(.2,.9,.25,1.15) both;
    position: sticky;
    top: 12px;
    z-index: 100;
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    box-shadow: 0 10px 40px -20px var(--shadow), inset 0 1px rgba(255, 255, 255, 0.05);
}
.header-left {
    display: flex;
    align-items: center;
    gap: 18px;
}
.main-logo {
    width: clamp(52px, 7vw, 72px);
    height: auto;
    transition: transform .3s cubic-bezier(.2,.9,.25,1.3);
    filter: drop-shadow(0 8px 24px rgba(92, 184, 92, 0.25));
}
.main-logo:hover {
    transform: scale(1.08) rotate(-4deg);
    filter: drop-shadow(0 12px 32px rgba(92, 184, 92, 0.4));
}
.title-wrap { display: flex; flex-direction: column; gap: 2px; }
h1 {
    font-size: clamp(1.6rem, 4.4vw, 2.35rem);
    font-weight: 900;
    letter-spacing: -0.055em;
    line-height: 1;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 2px;
}
h1 .accent {
    background: linear-gradient(135deg, #8cd88c, #4a9e4a);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
}
.tagline {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--text-dim);
}
.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}
.search-wrap {
    position: relative;
    width: min(300px, 100%);
}
.search-wrap svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 17px; height: 17px;
    stroke: var(--text-dim);
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    pointer-events: none;
    transition: stroke .2s ease;
}
.search {
    width: 100%;
    height: 46px;
    padding: 0 18px 0 44px;
    border-radius: 12px;
    border: 1.5px solid rgba(120, 200, 120, 0.22);
    background: rgba(10, 25, 10, 0.5);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color .25s ease, background .25s ease, box-shadow .25s ease;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
.search:focus {
    border-color: rgba(140, 240, 140, 0.6);
    background: rgba(25, 55, 25, 0.6);
    box-shadow: 0 0 0 4px rgba(92, 184, 92, 0.15);
}
.search-wrap:focus-within svg { stroke: var(--accent); }
.search::placeholder { color: var(--text-dim); }

#sortOptions {
    height: 46px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1.5px solid rgba(120, 200, 120, 0.22);
    background: rgba(10, 25, 10, 0.5);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
    transition: border-color .25s ease, background .25s ease;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
#sortOptions:hover { border-color: rgba(140, 240, 140, 0.45); background: rgba(25, 55, 25, 0.55); }
#sortOptions:focus { border-color: rgba(140, 240, 140, 0.6); box-shadow: 0 0 0 4px rgba(92, 184, 92, 0.15); }
#sortOptions option { background: #0f1a0f; color: var(--text); }

/* Buttons */
.theme-toggle, #settings {
    height: 46px;
    border-radius: 12px;
    border: 1.5px solid rgba(120, 200, 120, 0.22);
    background: rgba(10, 25, 10, 0.5);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .25s cubic-bezier(0.22, 0.98, 0.36, 1), background .25s ease, border-color .25s ease, box-shadow .25s ease;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    width: 46px;
    padding: 0;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
.theme-toggle:hover, #settings:hover {
    transform: translateY(-3px) scale(1.06);
    border-color: rgba(140, 240, 140, 0.5);
    background: rgba(30, 60, 30, 0.55);
    box-shadow: 0 8px 24px -10px rgba(92, 184, 92, 0.4);
}
.theme-toggle:active, #settings:active { transform: translateY(-1px) scale(.97); }
.theme-toggle svg {
    width: 18px; height: 18px;
    stroke: currentColor; fill: none;
    stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round;
}

/* MAIN */
main {
    max-width: 1240px;
    margin: 0 auto;
    padding-bottom: 4rem;
    position: relative;
    z-index: 1;
}

details {
    margin-bottom: 1.75rem;
    animation: bounceIn .5s cubic-bezier(.2,.9,.25,1.15) both;
}
details:nth-of-type(2) { animation-delay: .08s; }
details summary {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    cursor: pointer;
    padding: 10px 4px;
    list-style: none;
    color: var(--text);
    transition: color .2s ease;
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
}
details summary::-webkit-details-marker { display: none; }
details summary::before {
    content: "";
    width: 8px; height: 8px;
    border-right: 2.4px solid var(--text-dim);
    border-bottom: 2.4px solid var(--text-dim);
    transform: rotate(-45deg);
    transition: transform .35s cubic-bezier(.2,.9,.25,1.15), border-color .2s ease;
    margin-left: 4px;
}
details[open] summary::before {
    transform: rotate(45deg);
    border-color: var(--accent);
}
details summary:hover { color: var(--text-dim-2); }

#container,
#featuredZones {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
    margin-top: 1rem;
}

/* Game card — glass green with bouncy hover */
.zone-item {
    display: flex;
    flex-direction: column;
    padding: 10px;
    border-radius: 16px;
    background: rgba(15, 30, 15, 0.28);
    border: 1.5px solid rgba(120, 200, 120, 0.15);
    cursor: pointer;
    transition: transform .3s cubic-bezier(.2,.9,.25,1.15), border-color .25s ease, box-shadow .25s ease, background .25s ease;
    will-change: transform;
    contain: layout style paint;
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    animation: bounceIn .5s cubic-bezier(.2,.9,.25,1.15) both;
}
.zone-item:hover {
    border-color: rgba(140, 240, 140, 0.5);
    background: rgba(40, 80, 40, 0.2);
    transform: translateY(-8px) scale(1.03);
    box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6), 0 0 40px -10px rgba(92, 184, 92, 0.25);
}
.zone-item:hover img { transform: scale(1.05); }
.zone-item img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 11px;
    background: var(--bg-2);
    display: block;
    transition: transform .35s cubic-bezier(.2,.9,.25,1.15);
}
.zone-item button {
    background: transparent;
    color: var(--text);
    border: 0;
    padding: 12px 4px 4px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
}

.empty-msg {
    grid-column: 1 / -1;
    padding: 50px 20px;
    text-align: center;
    color: var(--text-dim);
    font-weight: 600;
    font-size: 15px;
}

/* ZONE VIEWER */
#zoneViewer {
    position: fixed;
    inset: 0;
    background: #0a0f0a;
    background-image: url('/public/assets/backgrounds/background.png');
    background-size: cover;
    background-position: center;
    z-index: 9999;
    display: none;
    flex-direction: column;
}
#zoneViewer.active {
    display: flex;
    animation: popIn .3s cubic-bezier(.2,.9,.25,1.15);
}

.zone-header {
    background: rgba(15, 30, 15, 0.7);
    border-bottom: 1.5px solid rgba(120, 200, 120, 0.18);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
}
.zone-title { flex: 1; min-width: 0; }
#zoneName {
    font-size: 1.1rem;
    font-weight: 800;
    margin: 0 0 3px;
    letter-spacing: -0.02em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
#zoneId { display: none; }
#zoneAuthor {
    font-size: 12.5px;
    color: var(--text-dim);
    text-decoration: none;
    font-weight: 600;
}
#zoneAuthor:hover { color: var(--accent); }

.zone-controls { display: flex; gap: 8px; flex-wrap: wrap; }
.zone-controls button {
    height: 38px;
    padding: 0 14px;
    border-radius: 10px;
    border: 1.5px solid rgba(120, 200, 120, 0.22);
    background: rgba(10, 25, 10, 0.5);
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.2,.9,.25,1.15), background .25s ease, border-color .25s ease;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
.zone-controls button:hover {
    transform: translateY(-2px) scale(1.04);
    border-color: rgba(140, 240, 140, 0.5);
    background: rgba(40, 80, 40, 0.5);
}
.zone-controls button:active { transform: scale(.96); }

#zoneFrame {
    flex: 1;
    border: 0;
    width: 100%;
    background: #0a0f0a;
}

/* POPUP */
#popupOverlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 12, 5, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 12000;
    padding: 20px;
    backdrop-filter: blur(32px) saturate(140%);
    -webkit-backdrop-filter: blur(32px) saturate(140%);
}
#popupOverlay.active { display: flex; animation: fadeUp .3s ease; }
.popup {
    background: rgba(20, 40, 20, 0.5);
    border-radius: 20px;
    box-shadow: 0 30px 70px -10px var(--shadow), inset 0 1px rgba(255, 255, 255, 0.05);
    width: 100%;
    max-width: 500px;
    max-height: 80vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1.5px solid rgba(120, 200, 120, 0.2);
    animation: bounceIn .4s cubic-bezier(.2,.9,.25,1.15);
    backdrop-filter: blur(40px) saturate(140%);
    -webkit-backdrop-filter: blur(40px) saturate(140%);
}
.popup-header {
    background: rgba(10, 25, 10, 0.5);
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(120, 200, 120, 0.15);
}
#popupTitle {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.02em;
}
#popupClose {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1.5px solid rgba(120, 200, 120, 0.22);
    background: rgba(10, 25, 10, 0.5);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .35s cubic-bezier(.2,.9,.25,1.15), background .25s ease;
}
#popupClose:hover {
    transform: rotate(90deg) scale(1.1);
    background: rgba(40, 80, 40, 0.5);
}
#popupBody {
    padding: 24px;
    overflow-y: auto;
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
}
#settings-button {
    width: 100%;
    padding: 14px;
    background: rgba(10, 25, 10, 0.5);
    color: var(--text);
    border: 1.5px solid rgba(120, 200, 120, 0.22);
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
    transition: transform .25s cubic-bezier(.2,.9,.25,1.15), background .25s ease, border-color .25s ease;
}
#settings-button:hover {
    transform: translateY(-2px);
    background: rgba(40, 80, 40, 0.5);
    border-color: rgba(140, 240, 140, 0.5);
}

/* PAGE SLIDE */
.page-slide {
    position: fixed;
    inset: 0;
    z-index: 30000;
    background: #0a0f0a;
    transform: translateX(100%);
    transition: transform .45s cubic-bezier(.65, 0, .35, 1);
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    will-change: transform;
}
.page-slide::after {
    content: "";
    width: 40px;
    height: 40px;
    border: 3px solid rgba(120, 200, 120, 0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    opacity: 0;
}
.page-slide.active {
    transform: translateX(0);
    pointer-events: auto;
}
.page-slide.active::after {
    opacity: 1;
    animation: spin .8s linear infinite;
}
.page-slide.enter { transform: translateX(0); transition: none; }
.page-slide.enter.leaving {
    transform: translateX(-100%);
    transition: transform .45s cubic-bezier(.65, 0, .35, 1);
}

/* Skeleton loading */
#container:empty::before {
    content: "";
    grid-column: 1 / -1;
    height: 200px;
    border-radius: 16px;
    background: linear-gradient(90deg, rgba(30, 60, 30, 0.3) 0%, rgba(50, 100, 50, 0.4) 50%, rgba(30, 60, 30, 0.3) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.6s infinite;
}

/* ============ RIGHT SIDE PANEL — matching main page ============ */
.side-dock {
    position: fixed;
    top: 0;
    bottom: 0;
    right: 0;
    z-index: 100;
    width: 180px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    gap: 6px;
    padding: 20px 12px;
    background: rgba(15, 30, 15, 0.55);
    border-left: 1px solid rgba(120, 200, 120, 0.15);
    animation: slideRight .45s cubic-bezier(0.22, 0.98, 0.36, 1) both;
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    transition: width 0.3s cubic-bezier(0.22, 0.98, 0.36, 1);
    box-shadow: -8px 0 32px rgba(0, 0, 0, 0.5);
}

.side-dock::before {
    content: "";
    position: absolute;
    left: 0;
    top: 18%;
    bottom: 18%;
    width: 2px;
    background: linear-gradient(180deg, transparent, var(--accent), var(--accent-2), transparent);
    opacity: .7;
    pointer-events: none;
    border-radius: 2px;
}

.dock-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6px 10px;
    border-bottom: 1px solid rgba(120, 200, 120, 0.12);
    margin-bottom: 6px;
}
.dock-header span {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.6px;
    color: var(--text-dim);
    font-weight: 700;
}
.dock-collapse-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 8px;
    transition: all 0.2s;
}
.dock-collapse-btn:hover {
    background: var(--card-hover);
    color: var(--text);
}

.dock-items {
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    overflow-x: hidden;
    flex: 1;
    padding-right: 2px;
}
.dock-items::-webkit-scrollbar { width: 4px; }
.dock-items::-webkit-scrollbar-thumb {
    background: rgba(120, 200, 120, 0.2);
    border-radius: 4px;
}

.dock-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 12px;
    border-radius: 16px;
    text-decoration: none;
    color: var(--text-dim-2);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    background: transparent;
    border: 1px solid transparent;
    transition: all 0.3s cubic-bezier(0.22, 0.98, 0.36, 1);
    cursor: pointer;
    will-change: transform;
    font-family: inherit;
    flex-shrink: 0;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
.dock-item .label { flex: 1; text-align: left; }
.dock-item svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
    transition: stroke 0.2s ease, transform 0.3s cubic-bezier(0.22, 0.98, 0.36, 1);
}
.dock-item:hover {
    color: var(--text);
    background: rgba(50, 100, 50, 0.4);
    border-color: rgba(140, 240, 140, 0.5);
    transform: translateY(-4px) scale(1.04);
    box-shadow: 0 12px 28px -12px var(--shadow), 0 0 24px -8px rgba(92, 184, 92, 0.3);
}
.dock-item:hover svg {
    stroke: var(--accent);
    transform: scale(1.15) rotate(-6deg);
}
.dock-item:active {
    transform: translateY(-1px) scale(1.01);
}
.dock-item.active {
    color: var(--text);
    background: rgba(60, 120, 60, 0.3);
    border-color: rgba(120, 200, 120, 0.35);
}
.dock-item.games-btn {
    background: linear-gradient(135deg, rgba(60, 140, 60, 0.18), rgba(40, 100, 40, 0.12));
    border: 1px solid rgba(120, 200, 120, 0.4);
    color: var(--text);
}
.dock-item.games-btn svg { stroke: var(--accent); }
.dock-item.games-btn:hover {
    background: linear-gradient(135deg, rgba(92, 184, 92, 0.38), rgba(58, 158, 58, 0.28));
    border-color: rgba(140, 240, 140, 0.65);
    color: #fff;
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 14px 32px -10px var(--accent-glow);
}
.dock-item.games-btn:hover svg { stroke: #fff; }

.dock-sep {
    height: 1px;
    margin: 6px 8px;
    background: linear-gradient(90deg, transparent, rgba(120, 200, 120, 0.2), transparent);
    flex-shrink: 0;
}

/* Collapsed state */
.side-dock.collapsed {
    width: 60px;
    padding: 20px 6px;
    align-items: center;
}
.side-dock.collapsed .dock-header span,
.side-dock.collapsed .dock-item .label,
.side-dock.collapsed .dock-sep {
    display: none;
}
.side-dock.collapsed .dock-header {
    border-bottom: none;
    padding: 0 0 8px;
    justify-content: center;
}
.side-dock.collapsed .dock-collapse-btn { font-size: 18px; }
.side-dock.collapsed .dock-item {
    justify-content: center;
    padding: 0;
    width: 44px;
    height: 44px;
}
.side-dock.collapsed .dock-item svg { width: 20px; height: 20px; }
.side-dock.collapsed .dock-item .label { display: none; }

/* MOBILE */
@media (max-width: 720px) {
    body { padding: 14px 14px 60px; margin-right: 68px; }
    header {
        padding: 14px;
        gap: 12px;
        position: static;
        top: auto;
    }
    .header-left { gap: 12px; }
    .main-logo { width: 48px; }
    h1 { font-size: 1.5rem; }
    .tagline { font-size: 10px; }
    .header-right { width: 100%; }
    .search-wrap { width: 100%; flex: 1; min-width: 0; }
    .search { width: 100%; }
    #container, #featuredZones {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }
    .zone-item { padding: 7px; border-radius: 12px; }
    .zone-item button { font-size: 12px; padding: 10px 2px 2px; }
    .zone-controls button { height: 34px; padding: 0 10px; font-size: 11.5px; }

    .side-dock { width: 68px; padding: 16px 8px; gap: 6px; }
    .dock-item { height: 46px; padding: 0; justify-content: center; gap: 0; }
    .dock-item .label { display: none; }
    .dock-item svg { width: 21px; height: 21px; }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <img src="/logo.gif" alt="Yumix" class="main-logo">
        <div class="title-wrap">
            <h1>GN <span class="accent">Math</span></h1>
            <span class="tagline">Yumix Games</span>
        </div>
    </div>
    <div class="header-right">
        <div class="search-wrap">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="searchBar" class="search" placeholder="Search games..." autocomplete="off">
        </div>
        <select id="sortOptions">
            <option value="name">Name</option>
            <option value="id">ID (Date)</option>
            <option value="popular">Popular</option>
        </select>
        <button id="settings" title="Settings">⚙</button>
    </div>
</header>

<main>
    <details id="featuredZonesWrapper" open>
        <summary id="allZonesSummary">Featured Games</summary>
        <div id="featuredZones"></div>
    </details>
    <details id="allZonesWrapper" open>
        <summary id="allSummary">All Games</summary>
        <div id="container">Loading...</div>
    </details>
</main>

<!-- RIGHT SIDE PANEL — matching main page -->
<nav class="side-dock" id="sideDock" aria-label="Site navigation">
    <div class="dock-header">
        <span>Menu</span>
        <button class="dock-collapse-btn" id="dockCollapseBtn" title="Collapse/Expand">◀</button>
    </div>
    <div class="dock-items" id="dockItems">
        <a href="/" class="dock-item" id="homeBtn" data-dock-id="home" title="Home">
            <span class="label">Home</span>
            <svg viewBox="0 0 24 24"><path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM9 20v-6h6v6"/></svg>
        </a>
        <a href="/settings" class="dock-item" data-dock-id="settings" title="Settings">
            <span class="label">Settings</span>
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </a>
        <div class="dock-sep" aria-hidden="true"></div>
        <a href="#" class="dock-item games-btn active" id="gamesBtnActive" data-dock-id="games" title="Play Games">
            <span class="label">Games</span>
            <svg viewBox="0 0 24 24">
                <rect x="2" y="6" width="20" height="12" rx="3"/>
                <path d="M6 12h4M8 10v4M15 11h.01M17.5 13h.01"/>
            </svg>
        </a>
    </div>
</nav>

<div id="zoneViewer">
    <div class="zone-header">
        <div class="zone-title">
            <h2 id="zoneName">game</h2>
            <span id="zoneId" style="display: none;"></span>
            <a id="zoneAuthor" href="#" target="_blank">by Author</a>
        </div>
        <div class="zone-controls">
            <button onclick="fullscreenZone()">Fullscreen</button>
            <button onclick="aboutBlank()">New Tab</button>
            <button onclick="closeZone()">Close</button>
        </div>
    </div>
    <iframe id="zoneFrame" allowfullscreen
        allow="autoplay; fullscreen; gamepad; clipboard-write; accelerometer; gyroscope"
        referrerpolicy="no-referrer"></iframe>
</div>

<div id="popupOverlay">
    <div class="popup">
        <div class="popup-header">
            <h3 id="popupTitle">Title</h3>
            <button id="popupClose" onclick="closePopup()">×</button>
        </div>
        <div id="popupBody"></div>
    </div>
</div>

<div class="page-slide" id="pageSlide"></div>

<script>
/* PAGE SLIDE — entering animation */
(function () {
    const slide = document.getElementById("pageSlide");
    if (sessionStorage.getItem("slideFrom")) {
        sessionStorage.removeItem("slideFrom");
        slide.classList.add("enter");
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                slide.classList.add("leaving");
            });
        });
        setTimeout(() => {
            slide.classList.remove("enter", "leaving");
        }, 600);
    }
})();

/* SIDE DOCK — collapse + margin */
(function initDock() {
    const dock = document.getElementById('sideDock');
    const collapseBtn = document.getElementById('dockCollapseBtn');
    let collapsed = localStorage.getItem('dockCollapsed') === 'true';
    if (collapsed) dock.classList.add('collapsed');

    function updateMargin() {
        document.body.style.marginRight = collapsed ? '60px' : '180px';
    }
    collapseBtn.addEventListener('click', () => {
        collapsed = !collapsed;
        dock.classList.toggle('collapsed', collapsed);
        localStorage.setItem('dockCollapsed', collapsed);
        collapseBtn.textContent = collapsed ? '▶' : '◀';
        updateMargin();
    });
    if (collapsed) {
        collapseBtn.textContent = '▶';
        updateMargin();
    }
})();

/* HOME BUTTON — slide out */
document.getElementById("homeBtn").addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("pageSlide").classList.add("active");
    sessionStorage.setItem("slideFrom", "true");
    setTimeout(() => {
        window.location.href = "/";
    }, 500);
});

/* =========================================================
   GN MATH LOADER
   ========================================================= */
const container = document.getElementById('container');
const featuredContainer = document.getElementById('featuredZones');
const zoneViewer = document.getElementById('zoneViewer');
let zoneFrame = document.getElementById('zoneFrame');
const searchBar = document.getElementById('searchBar');
const sortOptions = document.getElementById('sortOptions');

const zonesurls = [
    "https://cdn.jsdelivr.net/gh/lostgemsy/assets@main/zones.json",
    "https://cdn.jsdelivr.net/gh/lostgemsy/assets@latest/zones.json",
    "https://cdn.jsdelivr.net/gh/lostgemsy/assets@master/zones.json",
    "https://cdn.jsdelivr.net/gh/lostgemsy/assets/zones.json"
];
let zonesURL = zonesurls[0];
const coverURL = "https://cdn.jsdelivr.net/gh/lostgemsy/covers@main";
const htmlURL = "https://cdn.jsdelivr.net/gh/lostgemsy/html@main";
let zones = [];
let popularityData = {};

async function listZones() {
    try {
        const response = await fetch(zonesURL + "?t=" + Date.now());
        const json = await response.json();
        zones = json;
        if (zones[0]) zones[0].featured = true;
        sortZones();
        displayFeaturedZones(zones.filter(z => z.featured));
        setTimeout(() => displayZones(zones), 50);
        fetchPopularity().then(() => {
            if (sortOptions.value === "popular") sortZones();
        });
        const search = new URLSearchParams(window.location.search);
        const id = search.get('id');
        if (id) {
            const zone = zones.find(z => z.id + '' == id + '');
            if (zone) openZone(zone);
        }
    } catch (error) {
        console.error(error);
        container.innerHTML = '<div class="empty-msg">Error loading games.</div>';
    }
}

async function fetchPopularity() {
    try {
        const response = await fetch("https://data.jsdelivr.com/v1/stats/packages/gh/lostgemsy/html@main/files?period=year");
        const data = await response.json();
        data.forEach(file => {
            const m = file.name.match(/\/(\d+)\.html$/);
            if (m) popularityData[parseInt(m[1])] = file.hits.total;
        });
    } catch (e) {}
}

function sortZones() {
    const sortBy = sortOptions.value;
    if (sortBy === 'name') zones.sort((a, b) => a.name.localeCompare(b.name));
    else if (sortBy === 'id') zones.sort((a, b) => a.id - b.id);
    else if (sortBy === 'popular') zones.sort((a, b) => (popularityData[b.id] || 0) - (popularityData[a.id] || 0));
}

function makeCard(file, index) {
    const card = document.createElement("div");
    card.className = "zone-item";
    card.style.animationDelay = Math.min(index * 0.03, 0.5) + "s";
    card.addEventListener("click", () => openZone(file));
    const img = document.createElement("img");
    img.dataset.src = file.cover.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
    img.alt = file.name;
    img.loading = "lazy";
    img.decoding = "async";
    img.className = "lazy-zone-img";
    card.appendChild(img);
    const btn = document.createElement("button");
    btn.textContent = file.name;
    btn.addEventListener("click", (e) => { e.stopPropagation(); openZone(file); });
    card.appendChild(btn);
    return card;
}

function displayFeaturedZones(list) {
    featuredContainer.innerHTML = "";
    list.forEach((f, i) => featuredContainer.appendChild(makeCard(f, i)));
    if (!list.length) featuredContainer.innerHTML = '<div class="empty-msg">No featured games.</div>';
    else document.getElementById("allZonesSummary").textContent = `Featured Games (${list.length})`;
    observeLazy('#featuredZones img.lazy-zone-img');
}

function displayZones(list) {
    const frag = document.createDocumentFragment();
    list.forEach((f, i) => frag.appendChild(makeCard(f, i)));
    container.innerHTML = "";
    container.appendChild(frag);
    if (!list.length) container.innerHTML = '<div class="empty-msg">No games found.</div>';
    else document.getElementById("allSummary").textContent = `All Games (${list.length})`;
    observeLazy('#container img.lazy-zone-img');
}

let lazyObserver = null;
function observeLazy(selector) {
    if (!lazyObserver) {
        lazyObserver = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    if (img.dataset.src) img.src = img.dataset.src;
                    obs.unobserve(img);
                }
            });
        }, { rootMargin: "200px", threshold: 0.01 });
    }
    document.querySelectorAll(selector).forEach(img => lazyObserver.observe(img));
}

let searchTimer = null;
searchBar.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
        const q = searchBar.value.toLowerCase();
        const filtered = q ? zones.filter(z => z.name.toLowerCase().includes(q)) : zones;
        if (q) document.getElementById("featuredZonesWrapper").removeAttribute("open");
        displayZones(filtered);
    }, 120);
});

sortOptions.addEventListener("change", () => {
    sortZones();
    displayZones(zones);
});

function openZone(file) {
    if (file.url.startsWith("http")) {
        window.open(file.url, "_blank");
        return;
    }
    const url = file.url.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
    fetch(url + "?t=" + Date.now()).then(r => r.text()).then(html => {
        zoneFrame.contentDocument.open();
        zoneFrame.contentDocument.write(html);
        zoneFrame.contentDocument.close();
        document.getElementById('zoneName').textContent = file.name;
        document.getElementById('zoneId').textContent = file.id;
        document.getElementById('zoneAuthor').textContent = "by " + file.author;
        if (file.authorLink) document.getElementById('zoneAuthor').href = file.authorLink;
        zoneViewer.classList.add("active");
        const u = new URL(window.location);
        u.searchParams.set('id', file.id);
        history.pushState(null, '', u.toString());
    }).catch(err => alert("Failed to load game: " + err));
}

function aboutBlank() {
    const w = window.open("about:blank", "_blank");
    const zone = zones.find(z => z.id + '' === document.getElementById('zoneId').textContent);
    if (!zone || !w) return;
    const url = zone.url.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
    fetch(url + "?t=" + Date.now()).then(r => r.text()).then(html => {
        w.document.open();
        w.document.write(html);
        w.document.close();
    });
}

function closeZone() {
    zoneViewer.classList.remove("active");
    zoneFrame.src = "about:blank";
    const u = new URL(window.location);
    u.searchParams.delete('id');
    history.pushState(null, '', u.toString());
}

function fullscreenZone() {
    if (zoneFrame.requestFullscreen) zoneFrame.requestFullscreen();
}

function closePopup() {
    document.getElementById('popupOverlay').classList.remove("active");
}

document.getElementById('settings').addEventListener('click', () => {
    document.getElementById('popupTitle').textContent = "Settings";
    document.getElementById('popupBody').innerHTML = `
        <p style="color: var(--text-dim); font-size:13px; margin-bottom:14px;">
            Configure your browsing experience from the full settings page.
        </p>
        <a href="/settings" style="
            display:block; text-align:center; padding:14px; text-decoration:none;
            background:rgba(10,25,10,.5); color:var(--text); border:1.5px solid rgba(120,200,120,.22);
            border-radius:12px; font-weight:700; font-size:14px;
        ">Open Full Settings Page →</a>
    `;
    document.getElementById('popupOverlay').classList.add("active");
});

// Games button is already active on this page — prevent default click
document.getElementById('gamesBtnActive').addEventListener('click', (e) => e.preventDefault());

listZones();
</script>

</body>
</html>
